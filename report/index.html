<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMO U등급 딜사이클 리포트</title>
    <script>
        if (localStorage.getItem('dmo_theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <link rel="icon" type="image/png" href="../img/dmo.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/tool.css">
    <meta property="og:title" content="DMO U등급 딜사이클 리포트">
    <meta property="og:description" content="U등급 디지몬 × 덱 37종의 300초 딜사이클 · 스킬포인트 배분 · 대안 빌드 비교">
    <meta property="og:image" content="../img/dmo.png">
    <style>
        /* ==================================================================
           리포트 전용. base.css → home.css → tool.css 다음에 적용된다.
           카드/그리드/스탯은 메인 index.html 의 모듈 언어를 그대로 쓴다.
           ================================================================== */

        /* 스킬 슬롯 색 — app.css 등급 색과 같은 방식으로 --sc 를 자손에 넘긴다 */
        .slot-1 { --sc: #5f6b76; }
        .slot-2 { --sc: #0d8a78; }
        .slot-3 { --sc: #a65f00; }
        .slot-4 { --sc: #6741d9; }
        .slot-5 { --sc: #c2255c; }
        html.dark-mode .slot-1 { --sc: #98a2ad; }
        html.dark-mode .slot-2 { --sc: #4de3c7; }
        html.dark-mode .slot-3 { --sc: #ffb84d; }
        html.dark-mode .slot-4 { --sc: #b197fc; }
        html.dark-mode .slot-5 { --sc: #ff8fab; }

        .slot-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 2px;
            font-family: var(--mono);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            color: var(--sc);
            background: color-mix(in srgb, var(--sc) 11%, transparent);
            border: 1px solid color-mix(in srgb, var(--sc) 34%, transparent);
        }
        .slot-chip .t { color: var(--ink-faint); font-size: 0.9em; }

        /* 헤드 메타 — 메인 hero-stats 를 그대로 쓰되 단위만 작게 */
        .hero-stats { margin-top: 34px; }
        .hero-stats dd .u { font-size: 0.75rem; color: var(--ink-faint); margin-left: 3px; }

        /* 기준 안내 ------------------------------------------------------- */
        .rp-mode-note {
            margin: 0 0 30px;
            font-size: 0.8438rem;
            line-height: 1.65;
            color: var(--ink-dim);
        }
        .rp-mode-note b { color: var(--ink); font-weight: 600; }

        /* 디지몬 선택 카드 — .module 을 버튼으로 쓰기 위한 최소 보정 -------- */
        button.module {
            width: 100%;
            font: inherit;
            text-align: left;
            letter-spacing: inherit;
            background: var(--bg-elev);
            cursor: pointer;
        }
        .dg-sub {
            display: block;
            margin-top: 5px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--ink-faint);
        }

        /* 상세 헤드 ------------------------------------------------------- */
        .rp-detailbar {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }
        .rp-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 15px;
            font-family: var(--mono);
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
            background: transparent;
            border: 1px solid var(--line-strong);
            border-radius: 3px;
            cursor: pointer;
            transition: color 0.18s, border-color 0.18s;
        }
        .rp-back:hover { color: var(--accent-ink); border-color: var(--accent); }
        .rp-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .rp-detailbar select { flex: 1; min-width: 220px; max-width: 340px; }
        .rp-detailbar .fld { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 220px; }

        /* 덱 정렬 전환 — tool.css 의 선택 칩을 그대로 쓴다 */
        .deck-sort { margin: -8px 0 22px; }

        /* 덱 카드 — .module 을 2열로 깔고 아이콘 자리에 U 수를 넣는다 -------- */
        .deck-grid { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 700px) {
            .deck-grid { grid-template-columns: 1fr; }
        }
        .u-badge {
            font-size: 0.9375rem;
            font-weight: 600;
            letter-spacing: 0;
            color: var(--accent-ink);
        }
        /* U 배지와 덱 이름을 한 줄에 세운다 */
        .deck-head { display: flex; align-items: center; gap: 14px; }
        .deck-head .module-icon { flex-shrink: 0; margin-bottom: 0; }
        .deck-head .module-title { margin: 0; }
        /* 쉼표로 끊은 조각. 조각 안에서는 줄이 바뀌지 않는다 */
        .module-title .nw { white-space: nowrap; }

        .deck-mod .module-desc { margin-top: 14px; }
        .deck-mod .deck-effs { margin-top: auto; padding-top: 14px; }

        /* 덱을 채우는 디지몬 — 이름 하나가 통째로 붙어 다닌다 */
        .deck-meta { line-height: 1.9; }
        .deck-meta .mem { white-space: nowrap; }
        .deck-meta .sep { font-style: normal; margin: 0 5px; opacity: 0.55; }
        /* 보고 있는 디지몬만 또렷하게 */
        .deck-meta .nm.on {
            font-weight: 600;
            color: var(--accent-ink);
            background: var(--accent-wash);
            padding: 1px 5px;
            margin: 0 -1px;
            border-radius: 2px;
        }

        .deck-meta {
            display: block;
            margin-top: 3px;
            font-size: 0.6875rem;
            letter-spacing: 0.02em;
            color: var(--ink-faint);
        }
        .deck-effs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
        .eff-chip {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 0.75rem;
            color: var(--ink-dim);
            background: var(--bg-sunken);
            border: 1px solid var(--line);
            white-space: nowrap;
        }
        .eff-chip b { font-weight: 600; color: var(--ink); }
        .eff-chip i {
            font-style: normal;
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--ink-faint);
        }
        /* 덱 전환은 상단바가 아니라 이 카드 안에서 한다 — 모바일 오터치를 줄인다 */
        .deck-card .field-label { margin: 18px 0 8px; }
        .deck-card select { width: 100%; max-width: 420px; }
        .deck-card .deck-meta { margin: 16px 0 0; font-size: 0.75rem; }
        .deck-card .hero-stats { margin-top: 22px; }

        .dg-head { margin-bottom: 30px; }
        .dg-rank {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--accent);
        }
        .dg-title {
            margin: 0;
            font-size: clamp(1.625rem, 4.4vw, 2.375rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.035em;
        }
        .dg-aoe-note {
            margin: 14px 0 0;
            font-size: 0.9063rem;
            line-height: 1.7;
            color: var(--ink-dim);
        }
        .dg-aoe-note b { color: var(--ink); font-weight: 600; }

        /* 표 보조 --------------------------------------------------------- */
        .rp-t { min-width: 640px; }
        .rp-rank { width: 58px; color: var(--ink-faint); white-space: nowrap; }
        .col-num { text-align: right; }

        /* 막대 — 셀 폭만큼 트랙을 깔고 그 안을 채운다 */
        .rp-track {
            display: block;
            height: 3px;
            margin-top: 5px;
            border-radius: 2px;
            background: var(--line);
            overflow: hidden;
        }
        .rp-fill {
            display: block;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            opacity: 0.6;
        }
        .rank-1 .rp-fill { opacity: 1; }
        .rp-share { display: flex; flex-direction: column; gap: 1px; min-width: 84px; }

        /* 상세 블록 ------------------------------------------------------- */
        .rp-block + .rp-block { margin-top: 26px; }
        .section-title .hint {
            font-family: var(--mono);
            font-size: 0.6875rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        /* 시퀀스 칩 ------------------------------------------------------- */
        .rp-seq { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .rp-seq .arrow { color: var(--ink-faint); font-size: 0.75rem; }
        .rp-seq .loop {
            font-family: var(--mono);
            font-size: 0.6875rem;
            letter-spacing: 0.1em;
            color: var(--accent-ink);
        }
        .rp-note { margin: 0; font-size: 0.875rem; line-height: 1.7; color: var(--ink-dim); }
        .rp-note b { color: var(--ink); font-weight: 600; }
        .rp-subhead {
            margin: 22px 0 12px;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }
        .rp-subhead:first-child { margin-top: 0; }

        /* 우선순위 -------------------------------------------------------- */
        .rp-prio { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
        .rp-prio li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg-sunken);
            border-radius: 3px;
        }
        .rp-prio .p-name {
            flex: 1;
            min-width: 0;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rp-prio .p-dps {
            font-family: var(--mono);
            font-size: 0.875rem;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--accent-ink);
        }
        .rp-prio .p-dps .unit { color: var(--ink-faint); font-weight: 400; }
        .rp-prio .p-cd {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--ink-faint);
            white-space: nowrap;
        }

        /* 1레벨은 기본으로 찍혀 있어 포인트가 들지 않는다 */
        .pts-base { color: var(--ink-faint); }

        .rp-skill-name { display: flex; align-items: center; gap: 9px; }
        .rp-off td { color: var(--ink-faint); }
        .rp-off .rp-skill-name { opacity: 0.75; }

        @media (max-width: 720px) {
            .rp-prio li { flex-wrap: wrap; gap: 8px 12px; }
            .rp-prio .p-cd { flex-basis: 100%; padding-left: 46px; }
            .rp-detailbar select { max-width: none; }
            /* 뒤로 버튼과 셀렉트가 나란히 붙지 않도록 줄을 갈라 놓는다 */
            .rp-detailbar .fld { flex: 1 0 100%; }
            .rp-back { height: 44px; }
        }
    </style>
</head>
<body>

    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
        <div class="shell">
            <nav class="crumbs" aria-label="위치">
                <a class="brand" href="../">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7Z"/>
                        <path d="M12 7.6 16.4 10v4L12 16.4 7.6 14v-4Z" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="brand-name">DMOKIT</span>
                </a>
                <span class="crumb-sep mono" aria-hidden="true">/</span>
                <span class="crumb-current mono" aria-current="page" id="crumb">Report</span>
            </nav>
            <div class="topbar-meta">
                <span class="status mono"><i class="dot"></i>System Online</span>
                <button class="theme-toggle" aria-label="다크모드로 전환" aria-pressed="false">🌙</button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-head shell">
            <p class="eyebrow mono">Report / U-Tier Deal Cycle</p>
            <h1 class="page-title">U등급 딜사이클 리포트</h1>
            <p class="page-sub">디지몬과 덱을 고르면 그 조합의 300초 딜사이클을 보여줍니다.</p>
            <p class="page-sub">스킬포인트 배분과 사용 순서, 대안 빌드까지 정리했습니다.</p>
            <dl class="hero-stats">
                <div>
                    <dt class="mono">Duration</dt>
                    <dd id="metaDuration">&mdash;</dd>
                </div>
                <div>
                    <dt class="mono">Skill Points</dt>
                    <dd id="metaSp">&mdash;</dd>
                </div>
                <div>
                    <dt class="mono">Digimon</dt>
                    <dd id="metaCount">&mdash;</dd>
                </div>
                <div>
                    <dt class="mono">Decks</dt>
                    <dd id="metaDecks">&mdash;</dd>
                </div>
            </dl>
        </div>

        <div class="views shell">

            <div class="rp-detailbar" id="detailBar" hidden>
                <button class="rp-back" type="button" id="backBtn">
                    <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 8H3M7 4 3 8l4 4"/>
                    </svg>
                    뒤로
                </button>
                <span class="fld">
                    <label class="field-label mono" for="pickSel" style="margin:0">디지몬</label>
                    <select id="pickSel" aria-label="디지몬 선택"></select>
                </span>
            </div>

            <p class="rp-mode-note"><b>기본 광역기는 딜사이클에서 제외</b></p>

            <!-- 목록 ------------------------------------------------------ -->
            <section id="viewList">
                <div class="section-head mono">
                    <h2>Digimon</h2>
                    <span class="rule"></span>
                    <span class="count" id="listCount"></span>
                </div>
                <div class="module-grid" id="pickGrid"></div>
            </section>

            <!-- 덱 목록 ---------------------------------------------------- -->
            <section id="viewDecks" hidden></section>

            <!-- 덱별 결과 -------------------------------------------------- -->
            <section id="viewDetail" hidden></section>

        </div>
    </main>

    <footer class="site-footer">
        <div class="shell">
            <span>&copy; 2026 오메가몬 서버 우람</span>
            <span class="en">Built for DMO players</span>
        </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/report/report.js"></script>
</body>
</html>
