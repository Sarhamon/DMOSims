<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMO 던전 클리어 보상</title>
    <script src="../js/theme-init.js"></script>
    <link rel="icon" type="image/png" href="../img/dmo.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/tool.css">
    <link rel="stylesheet" href="../css/app.css">
    <meta property="og:title" content="DMO 던전 클리어 보상">
    <meta property="og:description" content="던전별 클리어 보상과 주간 T 획득량을 계산해보세요.">
    <meta property="og:image" content="../img/dmo.png">
</head>
<body>

    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
        <div class="shell">
            <nav class="crumbs" aria-label="위치">
                <a class="brand" href="../">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7Z"/>
                        <path d="M12 7.6 16.4 10v4L12 16.4 7.6 14v-4Z" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="brand-name">DMOKIT</span>
                </a>
                <span class="crumb-sep mono" aria-hidden="true">/</span>
                <span class="crumb-current mono" aria-current="page">Dungeon</span>
            </nav>
            <div class="topbar-meta">
                <span class="status mono"><i class="dot"></i>System Online</span>
                <button class="theme-toggle" aria-label="다크모드로 전환" aria-pressed="false">🌙</button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-head shell">
            <p class="eyebrow mono">Module 08 / Dungeon Reward</p>
            <h1 class="page-title">던전 클리어 보상</h1>
            <p class="page-sub">던전별 클리어 보상과 주간 T 획득량을 계산합니다. 횟수는 매주 화요일에 초기화됩니다.</p>
        </div>

        <div class="views shell">
            <p class="panel-desc">같은 그룹의 던전은 입장 횟수와 보상 획득 횟수를 함께 씁니다. 그룹마다 클리어할 던전을 고르면 보상 횟수를 모두 그 던전에서 받은 것으로 보고 주간 T 획득량을 합산합니다.</p>
            <div class="summary-box">
                <div class="summary-item">
                    <span class="summary-target">주간 합계</span>
                    <span class="summary-value" id="dungeonTotal"></span>
                </div>
            </div>
            <div class="dg-grid" id="dungeonGrid"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="shell">
            <span>&copy; 2026 오메가몬 서버 우람</span>
            <span class="en">Built for DMO players</span>
        </div>
    </footer>

    <script type="module" src="../js/dungeon/main.js"></script>
</body>
</html>
